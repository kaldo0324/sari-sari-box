<section class="container my-5">
    <div class="row">
        <div class="col-md-6">
            <h3>Reach Out to Us</h3>
            <form id="contactForm">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary px-4">Send Message</button>
            </form>

            <div id="successMessage" class="alert alert-success mt-3 d-none" role="alert">
                Salamat! Your message has been sent. We'll get back to you soon.
            </div>
        </div>
        
        <div class="col-md-6 px-lg-5">
            <h3>Our Hub</h3>
            <p>123 Mabini St, Malate, Manila, Philippines</p>
            <div class="ratio ratio-16x9 shadow-sm rounded">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3861.233519842512!2d120.9822!3d14.5700!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397ca28e7e9adad%3A0x1d3a4d0!2sMalate%2C%20Manila!5e0!3m2!1sen!2sph!4v1620000000000" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </div>
</section>

<script>
    document.getElementById('contactForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevents the page from refreshing
        
        // Hide the form
        this.classList.add('d-none');
        
        // Show the success message
        document.getElementById('successMessage').classList.remove('d-none');
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
